name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt "pyinstaller>=6.0"
      - run: >
          python -m PyInstaller
          --noconfirm --clean --onefile --console
          --name dota-match-bot
          --collect-all telegram
          bot.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/dota-match-bot.exe
